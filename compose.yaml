services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gambitrate
      POSTGRES_USER: gambitrate
      POSTGRES_PASSWORD: gambitrate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gambitrate -d gambitrate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: gambitrate
      DATABASE_USER: gambitrate
      DATABASE_PASSWORD: gambitrate
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHESSCOM_USER_AGENT: "GambitRate/1.0 (contact: you@example.com)"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
